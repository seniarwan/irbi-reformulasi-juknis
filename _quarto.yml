project:
  type: website
  output-dir: docs
  resources:
    - data/isu_terbuka.csv

website:
  title: "Petunjuk Teknis IRBI Reformulasi"
  description: "Draf kerja Petunjuk Teknis Nasional IRBI — metode, data, pengendalian mutu, dan implementasi"
  favicon: favicon.svg
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  page-footer:
    left: "Petunjuk Teknis Reformulasi IRBI Nasional — draf kerja, belum normatif"
    right: "Versi dashboard 0.8 · 19 September 2026"
  navbar:
    background: primary
    search: true
    left:
      - text: "Beranda"
        href: index.qmd
      - text: "Register Isu"
        href: register-isu.qmd
    right:
      - icon: github
        href: https://github.com/seniarwan/irbi-reformulasi-juknis
        text: "Repositori"
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - index.qmd
      - section: "Petunjuk Teknis — 8 Bab"
        contents:
          - bab-1.qmd
          - bab-2.qmd
          - bab-3.qmd
          - bab-4.qmd
          - bab-5.qmd
          - bab-6.qmd
          - bab-7.qmd
          - bab-8.qmd
      - section: "Lampiran Operasional"
        contents:
          - lampiran-a.qmd
          - lampiran-b.qmd
          - lampiran-c.qmd
          - lampiran-d.qmd
          - lampiran-e.qmd
          - lampiran-f.qmd
          - lampiran-g.qmd
          - lampiran-h.qmd
      - section: "Kendali Pengembangan"
        contents:
          - register-isu.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    smooth-scroll: true
    code-copy: false
    link-external-icon: true
    link-external-newwindow: true
    grid:
      sidebar-width: 290px
      body-width: 900px
      margin-width: 250px
    mermaid:
      theme: neutral

execute:
  freeze: auto
